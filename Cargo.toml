[workspace]
members = ["crates/wallet-vault", "crates/wallet-core", "crates/quai-terminal"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/mpoletiek/quai-rust-cli-wallet"

[workspace.dependencies]
quai-sdk = { version = "=0.1.0-alpha.14", features = ["sqlite", "ws", "abi", "payments", "keystore", "backup"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "fs", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4"
directories = "6"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "socks"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.48", default-features = false }
sha2 = "0.10"
hkdf = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Explicit drops end key-material borrows early; wide request builders mirror SDK signatures.
drop_non_drop = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
unnecessary_sort_by = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
# Symbols are for debuggers, not users; panics still unwind so secrets are zeroized on the way out.
strip = "symbols"

# Key derivation and zone grinding are CPU heavy; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
