# Every push and pull request: formatting, lints as errors, unit tests, a RustSec advisory scan, and
# the install scripts linted and parsed by the `sh` most users will pipe them into.
# Live mainnet tests (`--ignored`) need the network and are run by hand before a release.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --tests --locked
      # The frame budget: every screen's render time on the golden fixture, in a release build.
      - run: cargo test --release --locked -p quai-terminal-cli frame_budget -- --ignored

  # `curl … | sh` runs these under whatever /bin/sh is: dash on Debian and Ubuntu, so no bashisms.
  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh uninstall.sh
      - run: dash -n install.sh && dash -n uninstall.sh

  audit:
    runs-on: ubuntu-latest
    # The advisory scan reports as a check run, which needs to write one; nothing else here does.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
