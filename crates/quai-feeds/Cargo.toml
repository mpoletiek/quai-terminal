[package]
name = "quai-feeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quai Terminal's untrusted inputs: the HTTP client, the explorer, IPFS, and pictures (decoded in a sandboxed helper process). Holds no keys and signs nothing."

[dependencies]
quai-model = { path = "../quai-model" }
quai-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
image.workspace = true
resvg.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "thread", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
