[package]
name = "wallet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wallet-vault = { path = "../wallet-vault" }
quai-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rusqlite.workspace = true
toml.workspace = true
directories.workspace = true
hex.workspace = true
base64.workspace = true
reqwest.workspace = true
image.workspace = true
resvg.workspace = true
sha2.workspace = true
hkdf.workspace = true
chacha20poly1305.workspace = true
futures = "0.3"
hmac = "0.12"
# Sealed messages v3 (docs/MESSAGING_V3.md): HPKE (RFC 9180) with X25519 and ChaCha20-Poly1305,
# and Ed25519 for signed key announcements. Only the features that suite needs.
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }

# The picture-decoding helper shuts itself in before touching untrusted bytes (media_helper.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "thread", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Constructors for the SDK's observation outputs, so settlement tests can state what a tracker saw.
# Tests only: production code must never make up an observation.
quai-sdk = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
