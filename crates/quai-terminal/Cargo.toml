[package]
name = "quai-terminal-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quai Terminal: a keyboard-first CLI/TUI wallet for Quai Network"

[[bin]]
name = "quai-terminal"
path = "src/main.rs"

[dependencies]
wallet-core = { path = "../wallet-core" }
wallet-vault = { path = "../wallet-vault" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
toml.workspace = true
base64.workspace = true
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tachyonfx = "0.25"
ttfx = { git = "https://github.com/omacom/ttfx", rev = "7203e35" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
rpassword = "7"
qrcode = { version = "0.14", default-features = false }
nucleo-matcher = "0.3"
futures = "0.3"
png = "0.18"
unicode-width = "0.2"
# Local time for chart axes (already in the dependency tree).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Marking the process non-dumpable (already in the dependency tree, through crossterm).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std", "fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
